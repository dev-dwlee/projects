<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Software - Dongwoo Lee</title>
    <meta name="description" content="Engineering software and tools by Dongwoo Lee.">
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <header class="site-header">
      <div class="shell">
        <nav class="nav" aria-label="Primary navigation">
          <a href="https://dev-dwlee.github.io/" class="nav-back"><span>←</span><span>Home</span></a>
          <div class="nav-divider" aria-hidden="true"></div>
          <strong>Software</strong>
          <a href="https://github.com/dev-dwlee" target="_blank" rel="noopener noreferrer">GitHub ↗</a>
        </nav>
      </div>
    </header>
    <main class="shell">
      <section class="hero">
        <p class="eyebrow">Engineering & Research</p>
        <h1>Software</h1>
        <p class="lede">Open-source computational tools, research software implementations, and benchmarks.</p>
      </section>
      <section class="grid" id="projects" aria-label="Project list"></section>
    </main>
    <footer>&copy; 2026 Dongwoo Lee. Software Archive.</footer>
    <script src="./projects.js"></script>
    <script>
      const root = document.querySelector("#projects");
      if (typeof projects !== 'undefined' && projects.length > 0) {
        root.innerHTML = projects.map((p) => `
          <article class="card">
            <span class="status">${p.status || 'Active'} · ${p.domain || 'Tech'}</span>
            <h3>${p.title}</h3>
            <p>${p.summary || ''}</p>
            <div class="project-links">
              ${p.source ? `<a href="${p.source}" target="_blank" rel="noreferrer">Source ↗</a>` : ''}
              ${p.demo ? `<a href="${p.demo}" target="_blank" rel="noreferrer">Demo ↗</a>` : ''}
              ${p.writeup ? `<a href="${p.writeup}">Write-up →</a>` : ''}
            </div>
          </article>
        `).join('');
      } else {
        root.innerHTML = `
          <article class="card" style="grid-column: 1 / -1; padding: 2rem 1.5rem;">
            <span class="status">Active Pipeline</span>
            <h3>Active Project Pipeline</h3>
            <p>Research software, computational packages, and open-source tools will be indexed here as they are developed.</p>
          </article>
        `;
      }
    </script>
  </body>
</html>
